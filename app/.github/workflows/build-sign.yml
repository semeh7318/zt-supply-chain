name: build-sign
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nom d'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zt-app" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:latest

      - uses: sigstore/cosign-installer@v3

      - name: Signer l'image
        run: cosign sign --yes ${IMAGE}@${{ steps.build.outputs.digest }}

      - name: Générer le SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attacher le SBOM signé
        run: |
          cosign attest --yes --type spdxjson \
            --predicate sbom.spdx.json \
            ${IMAGE}@${{ steps.build.outputs.digest }}
