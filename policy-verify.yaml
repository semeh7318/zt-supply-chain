apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-signed-images
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-cosign-keyless
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [prod]
      verifyImages:
        - imageReferences: ["*"]
          mutateDigest: true
          required: true
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/semeh7318/zt-supply-chain/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
